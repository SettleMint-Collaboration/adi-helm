{{- if and .Values.externalNode.enabled .Values.externalNode.network.perOrdinalKeys.enabled }}
{{- if not .Values.externalNode.network.perOrdinalKeys.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "adi-stack.fullname" . }}-external-node-p2p
  labels:
    {{- include "adi-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-node
type: Opaque
stringData:
  {{- /*
    One key per StatefulSet ordinal. The node's p2p identity is derived from this key, so
    every replica must have its own: two nodes presenting the same identity means only one
    of them can hold a connection to the bootnode, and the other silently receives no
    block replays.
  */}}
  {{- range $i, $key := .Values.externalNode.network.perOrdinalKeys.keys }}
  {{ $i | quote }}: {{ $key | quote }}
  {{- end }}
{{- end }}
{{- end }}
